name: 🚀 Main Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10

jobs:
  # ---------- Full Validation ----------
  validate:
    name: 🧪 Validation & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🔧 Setup Python 3.11 for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev python3-dev
          # Install distutils for the Python version from setup-python action
          python -m pip install --upgrade setuptools wheel
          # Verify distutils is available for node-gyp
          python -c "import setuptools; print('setuptools available for node-gyp')"

      - name: 📋 Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm run check-node-version

      - name: 🕵️ Security scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 TypeScript type check
        run: pnpm typecheck

      - name: 🧹 Lint & format check
        run: pnpm lint:check

      - name: 🧪 Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          VITEST_DATABASE_URL: ':memory:'

      - name: 🏗️ Build application
        run: pnpm build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ---------- Multi-Platform Packaging ----------
  package:
    name: 📦 Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm64
            arch: arm64
          - os: macos-latest
            platform: mac-x64
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Disable cache to prevent symlink conflicts during native module rebuilds
          # cache: pnpm

      # ---------- Platform-Specific Dependencies ----------
      - name: 🔧 Setup Python 3.11 (Unix)
        if: matrix.platform != 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Setup Python 3.11 (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev python3-dev
          # Install setuptools for the Python version from setup-python action
          python -m pip install --upgrade setuptools wheel
          # Verify setuptools availability
          python -c "import setuptools; print('setuptools ready for node-gyp')"

      - name: 🔧 Install system dependencies (macOS)
        if: startsWith(matrix.platform, 'mac')
        run: |
          # Ensure latest build tools
          xcode-select --install 2>/dev/null || true
          # Install setuptools for the Python version from setup-python action
          python -m pip install --upgrade setuptools wheel
          # Verify setuptools availability
          python -c "import setuptools; print('setuptools ready for node-gyp')"

      - name: 🔧 Configure Python for native modules (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          # Set UTF-8 encoding for consistent character handling
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # Install setuptools to provide distutils functionality
          python -m pip install --upgrade setuptools wheel
          # Verify build tools
          python -c "import setuptools; print('setuptools ready for node-gyp')"
        env:
          PYTHONIOENCODING: utf-8

      # ---------- Clean Build Environment ----------
      - name: 🧹 Clean node_modules and build artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "🧹 Cleaning node_modules and caches to prevent symlink conflicts..."
          npx rimraf node_modules
          npx rimraf ~/.npm ~/.electron-gyp ~/.pnpm-store 2>/dev/null || true
          # Clean pnpm cache
          pnpm store prune || echo "pnpm store prune failed, continuing..."

      - name: 🧹 Clean node_modules and build artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "🧹 Cleaning node_modules and caches to prevent symlink conflicts..."
          npx rimraf node_modules
          try { npx rimraf "$env:USERPROFILE\.npm" } catch { Write-Host "npm cache cleanup skipped" }
          try { npx rimraf "$env:USERPROFILE\.electron-gyp" } catch { Write-Host "electron-gyp cache cleanup skipped" }
          try { npx rimraf "$env:USERPROFILE\.pnpm-store" } catch { Write-Host "pnpm-store cleanup skipped" }
          # Clean pnpm cache
          try { pnpm store prune } catch { Write-Host "pnpm store prune failed, continuing..." }

      # ---------- Install Dependencies ----------
      - name: 📋 Install dependencies (clean) (Unix)
        if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile

      - name: 📋 Install dependencies (clean) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ensure UTF-8 encoding
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # Install dependencies
          pnpm install --frozen-lockfile

      # ---------- Download Build ----------
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

      # ---------- Platform-Specific Packaging ----------
      - name: 📦 Package for macOS ARM64
        if: matrix.platform == 'mac-arm64'
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 📦 Package for macOS Intel
        if: matrix.platform == 'mac-x64'
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 📦 Package for Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --x64 --publish never

      - name: 📦 Package for Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ---------- Upload Packages ----------
      - name: 📤 Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          retention-days: 90

  # ---------- Firebase Deployment (Optional) ----------
  deploy-firebase:
    name: 🔥 Deploy Firebase Functions
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Check Firebase secrets
        run: |
          if [[ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" || -z "${{ secrets.FIREBASE_PROJECT_ID }}" || -z "${{ secrets.OPENAI_API_KEY }}" ]]; then
            echo "⚠️ Firebase deployment skipped - missing required secrets"
            echo "Required: FIREBASE_SERVICE_ACCOUNT_KEY, FIREBASE_PROJECT_ID, OPENAI_API_KEY"
            exit 0
          fi
          echo "✅ All Firebase secrets available"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Firebase Functions use Node.js 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: 📋 Install Firebase Functions dependencies
        run: |
          cd functions
          npm ci

      - name: 🔑 Authenticate with Firebase
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 -d > $HOME/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      - name: 🔥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: ⚙️ Configure Firebase Functions environment
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > functions/.env

      - name: 🚀 Deploy Firebase Functions
        run: |
          cd functions
          npm run build
          firebase deploy --only functions --project=${{ secrets.FIREBASE_PROJECT_ID }} --force

  # ---------- Security Analysis ----------
  security:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 CodeQL analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔍 CodeQL autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 CodeQL analyze
        uses: github/codeql-action/analyze@v3

  # ---------- Release Summary ----------
  release:
    name: 🎉 Create Release
    needs: [validate, package, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.package.result == 'success'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*-${{ github.sha }}
          path: release-artifacts/
          merge-multiple: true

      - name: 📂 Organize release assets
        run: |
          echo "🔍 Listing downloaded artifacts:"
          find release-artifacts/ -type f -name "*" | head -20

          # Create release directory structure
          mkdir -p release/

          # Move all artifacts to release directory
          find release-artifacts/ -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "*.yml" -o -name "*.blockmap" \) -exec cp {} release/ \;

          echo "📦 Final release assets:"
          ls -la release/

      - name: 🏷️ Generate release tag
        id: tag
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          TAG="dev-${GITHUB_SHA:0:8}-$TIMESTAMP"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📋 Generated tag: $TAG"

      - name: 📝 Generate release notes
        id: notes
        run: |
          cat > release-notes.md << 'EOF'
          ## 🚀 Personyx Development Build

          **Build Information:**
          - **Commit**: `${{ github.sha }}`
          - **Branch**: `${{ github.ref_name }}`
          - **Timestamp**: `$(date -u +"%Y-%m-%d %H:%M:%S UTC")`

          **Platform Support:**
          - 🍎 **macOS** - Universal (Intel + Apple Silicon) DMG
          - 🐧 **Linux** - x64 AppImage
          - 🪟 **Windows** - x64 NSIS Installer

          **Features in this build:**
          - ✅ Phase 3.1.1 Chat with Persona feature
          - ✅ Hybrid AI key management (local + cloud)
          - ✅ Evidence-based persona insights
          - ✅ Secure file ingestion
          - ✅ Cross-platform desktop support

          **Installation:**
          1. Download the appropriate installer for your platform
          2. Run the installer and follow the setup wizard
          3. Configure your OpenAI API key or use Personyx Cloud

          ---
          ⚠️ **Development Build Notice**: This is an automated development build for testing purposes.
          EOF

          echo "Generated release notes"

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 'Personyx Dev Build - ${{ steps.tag.outputs.tag }}'
          body_path: release-notes.md
          files: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.zip
            release/*.yml
            release/*.blockmap
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Release Summary
        run: |
          echo "## 🎯 Release Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Packaging | ${{ needs.package.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Release created successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Release Tag: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Available Downloads:" >> $GITHUB_STEP_SUMMARY
          echo "- macOS DMG (Universal - Intel + Apple Silicon)" >> $GITHUB_STEP_SUMMARY  
          echo "- Linux AppImage (x64)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows NSIS Installer (x64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[🔗 View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
