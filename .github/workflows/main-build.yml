name: 🚀 Main Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10

jobs:
  # ---------- Full Validation ----------
  validate:
    name: 🧪 Validation & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🔧 Setup Python 3.11 for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev python3.11-dev python3.11-distutils
          # Ensure distutils is available for node-gyp
          python3.11 -c "import distutils; print('✅ distutils available')"

      - name: 📋 Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm run check-node-version

      - name: 🕵️ Security scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 TypeScript type check
        run: pnpm typecheck

      - name: 🧹 Lint & format check
        run: pnpm lint:check

      - name: 🧪 Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          VITEST_DATABASE_URL: ':memory:'

      - name: 🏗️ Build application
        run: pnpm build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ---------- Multi-Platform Packaging ----------
  package:
    name: 📦 Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: universal
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # ---------- Platform-Specific Dependencies ----------
      - name: 🔧 Setup Python 3.11 (Unix)
        if: matrix.platform != 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Setup Python 3.11 (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev python3.11-dev python3.11-distutils
          # Verify distutils availability
          python3.11 -c "import distutils; print('✅ distutils ready for node-gyp')"

      - name: 🔧 Install system dependencies (macOS)
        if: matrix.platform == 'mac'
        run: |
          # Ensure latest build tools
          xcode-select --install 2>/dev/null || true
          # Verify Python has distutils (should be available in 3.11)
          python3 -c "import distutils; print('✅ distutils ready for node-gyp')"

      - name: 🔧 Configure Python for native modules (Windows)
        if: matrix.platform == 'win'
        run: |
          # Install setuptools to provide distutils functionality
          python -m pip install --upgrade setuptools wheel
          # Verify build tools
          python -c "import setuptools; print('✅ setuptools ready for node-gyp')"

      # ---------- Install Dependencies ----------
      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------- Download Build ----------
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

      # ---------- Native Module Rebuild ----------
      - name: 🔧 Rebuild native modules for Electron
        run: |
          echo "🔧 Rebuilding native modules for Electron on ${{ matrix.platform }}..."
          npm run rebuild-for-electron
        env:
          npm_config_build_from_source: true
          npm_config_electron_version: 28.3.3
          npm_config_target: 28.3.3
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_prefer_offline: true

      # ---------- Platform-Specific Packaging ----------
      - name: 📦 Package for macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 📦 Package for Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --x64 --publish never

      - name: 📦 Package for Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ---------- Upload Packages ----------
      - name: 📤 Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          retention-days: 90

  # ---------- Firebase Deployment (Optional) ----------
  deploy-firebase:
    name: 🔥 Deploy Firebase Functions
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Check Firebase secrets
        run: |
          if [[ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" || -z "${{ secrets.FIREBASE_PROJECT_ID }}" || -z "${{ secrets.OPENAI_API_KEY }}" ]]; then
            echo "⚠️ Firebase deployment skipped - missing required secrets"
            echo "Required: FIREBASE_SERVICE_ACCOUNT_KEY, FIREBASE_PROJECT_ID, OPENAI_API_KEY"
            exit 0
          fi
          echo "✅ All Firebase secrets available"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Firebase Functions use Node.js 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: 📋 Install Firebase Functions dependencies
        run: |
          cd functions
          npm ci

      - name: 🔑 Authenticate with Firebase
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 -d > $HOME/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      - name: 🔥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: ⚙️ Configure Firebase Functions environment
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > functions/.env

      - name: 🚀 Deploy Firebase Functions
        run: |
          cd functions
          npm run build
          firebase deploy --only functions --project=${{ secrets.FIREBASE_PROJECT_ID }} --force

  # ---------- Security Analysis ----------
  security:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 CodeQL analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔍 CodeQL autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 CodeQL analyze
        uses: github/codeql-action/analyze@v3

  # ---------- Release Summary ----------
  release:
    name: 🎉 Release Summary
    needs: [validate, package, security]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📊 Generate build summary
        run: |
          echo "## 🎯 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Packaging | ${{ needs.package.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.validate.result }}" == "success" && "${{ needs.package.result }}" == "success" ]]; then
            echo "🎉 **Build completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Available Artifacts:" >> $GITHUB_STEP_SUMMARY
            echo "- macOS DMG (Universal)" >> $GITHUB_STEP_SUMMARY  
            echo "- Linux AppImage (x64)" >> $GITHUB_STEP_SUMMARY
            echo "- Windows NSIS Installer (x64)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Build had issues. Check job logs for details.**" >> $GITHUB_STEP_SUMMARY
          fi
