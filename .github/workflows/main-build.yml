name: 🚀 Main Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggers

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10

jobs:
  # ---------- Full Validation ----------
  validate:
    name: 🧪 Full Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- Checkout & Setup ----------
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Consistent with PR validation
          cache: pnpm

      # ---------- Install System Dependencies with Python 3.11 ----------
      - name: 🔧 Install system dependencies for native modules
        run: |
          sudo apt-get update
          # Install Python 3.11 specifically (has distutils, unlike 3.12+)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-dev python3.11-distutils
          # Install other build dependencies
          sudo apt-get install -y build-essential libsecret-1-dev
          # Configure Python for node-gyp
          sudo ln -sf /usr/bin/python3.11 /usr/bin/python3
          python3 --version
          echo "✅ System dependencies installed with Python 3.11"

      # ---------- Install Dependencies ----------
      - name: 📋 Install dependencies
        run: |
          echo "🔧 Installing dependencies with proper Electron native module configuration..."
          # Install dependencies first
          pnpm install --frozen-lockfile
          echo "✅ Dependencies installed successfully"

      # ---------- Comprehensive Native Module Setup ----------
      - name: 🔧 Rebuild native modules for Electron
        run: |
          echo "🔧 Rebuilding native modules for Electron compatibility..."

          # Clear any potentially problematic build artifacts
          echo "🧹 Cleaning build artifacts..."
          rm -rf node_modules/.pnpm/better-sqlite3*/node_modules/better-sqlite3/build || true
          rm -rf node_modules/.pnpm/keytar*/node_modules/keytar/build || true
          find node_modules -name "node_gyp_bins" -type d -exec rm -rf {} + 2>/dev/null || true

          # Rebuild native modules specifically for Electron's Node version
          echo "🏗️ Rebuilding with electron-builder..."
          pnpm exec electron-builder install-app-deps

          echo "✅ Native module rebuild completed successfully"
        env:
          npm_config_build_from_source: true
          npm_config_electron_version: 28.3.3
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target: 28.3.3
          PYTHON: /usr/bin/python3.11

      # ---------- Security & Quality ----------
      - name: 🕵️ Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 TypeScript Type Check
        run: pnpm typecheck

      - name: 🧹 ESLint & Prettier Check
        run: pnpm lint

      - name: 🧪 Run Test Suite
        run: pnpm test --passWithNoTests --reporter=verbose
        env:
          # Use in-memory database for tests to avoid native module issues
          NODE_ENV: test
          VITEST_DATABASE_URL: ':memory:'

      # ---------- Build Application ----------
      - name: 🏗️ Build Application
        run: pnpm build

      # ---------- Database Validation ----------
      - name: 🗄️ Validate Database Schema & Migrations
        run: |
          echo "🗄️ Validating database schema and migrations..."
          npm run db:validate
          echo "✅ Database validation completed"
        env:
          npm_config_build_from_source: true

      # ---------- Upload Build for Next Job ----------
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ---------- Multi-Platform Packaging ----------
  package:
    name: 📦 Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # Increased timeout for native module compilation

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: universal
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    steps:
      # ---------- Checkout & Setup ----------
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Consistent with PR validation
          cache: pnpm

      # ---------- CRITICAL: Platform-Specific Python Setup BEFORE Install ----------
      - name: 🔧 Setup Python 3.11 for native modules (Linux)
        if: matrix.platform == 'linux'
        run: |
          echo "🔧 Setting up Python 3.11 for Linux native module compilation..."
          sudo apt-get update
          # Install Python 3.11 specifically (has distutils, unlike 3.12+)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-dev python3.11-distutils
          # Install other build dependencies
          sudo apt-get install -y build-essential libsecret-1-dev
          # Configure Python for node-gyp
          sudo ln -sf /usr/bin/python3.11 /usr/bin/python3
          python3 --version
          echo "✅ Linux Python 3.11 setup completed successfully"

      - name: 🔧 Setup Python 3.11 for native modules (macOS)
        if: matrix.platform == 'mac'
        run: |
          echo "🔧 Setting up Python 3.11 for macOS native module compilation..."
          # Install Python 3.11 via Homebrew to avoid distutils issues
          brew install python@3.11
          # Configure Python paths for node-gyp
          echo "/opt/homebrew/opt/python@3.11/bin" >> $GITHUB_PATH
          export PATH="/opt/homebrew/opt/python@3.11/bin:$PATH"
          export PYTHON="/opt/homebrew/opt/python@3.11/bin/python3.11"
          # Update environment for current session
          echo "PYTHON=/opt/homebrew/opt/python@3.11/bin/python3.11" >> $GITHUB_ENV
          echo "npm_config_python=/opt/homebrew/opt/python@3.11/bin/python3.11" >> $GITHUB_ENV
          # Verify Python setup
          python3.11 --version
          python3.11 -c "import distutils; print('✅ distutils available')"
          echo "✅ macOS Python 3.11 setup completed successfully"

      - name: 🔧 Setup Python 3.11 for native modules (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Configure Python for Windows native modules
        if: matrix.platform == 'win'
        run: |
          echo "🔧 Configuring Python 3.11 for Windows native module compilation..."

          # Get Python installation path
          $pythonPath = (Get-Command python).Source
          $pythonDir = Split-Path $pythonPath -Parent
          echo "Python found at: $pythonPath"
          echo "Python directory: $pythonDir"

          # Configure Python paths for node-gyp
          echo "PYTHON=$pythonPath" >> $env:GITHUB_ENV
          echo "npm_config_python=$pythonPath" >> $env:GITHUB_ENV

          # Verify Python setup
          python --version
          python -c "import sys; print('Python executable:', sys.executable)"

          # Check distutils availability and install setuptools if needed
          echo "🔍 Checking Python build tools availability..."
          $distutils_available = $false
          try {
            python -c "import distutils; print('✅ distutils available')" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $distutils_available = $true
              echo "✅ distutils available"
            }
          } catch {
            # Ignore distutils check errors
          }

          if (-not $distutils_available) {
            echo "⚠️ distutils not available, ensuring setuptools is installed..."
            python -m pip install --upgrade setuptools wheel
            if ($LASTEXITCODE -eq 0) {
              echo "✅ setuptools installed successfully"
            } else {
              echo "❌ Failed to install setuptools, but continuing..."
            }
          }

          # Verify build tools are working
          try {
            python -c "import setuptools; print('✅ setuptools available')"
            echo "✅ Python build environment ready for native modules"
          } catch {
            echo "⚠️ setuptools check failed, but native modules may still work"
          }

          # Configure additional Windows build environment for native modules
          echo "🔧 Configuring Windows build environment..."

          # Ensure MSBuild is available (should be pre-installed on GitHub runners)
          try {
            $msbuildPath = (Get-Command msbuild -ErrorAction SilentlyContinue).Source
            if ($msbuildPath) {
              echo "✅ MSBuild found at: $msbuildPath"
              echo "npm_config_msbuild_path=$msbuildPath" >> $env:GITHUB_ENV
            } else {
              echo "⚠️ MSBuild not found in PATH, but may still work"
            }
          } catch {
            echo "⚠️ MSBuild check failed, but may still work"
          }

          # Configure node-gyp for Windows
          echo "npm_config_cache=$env:TEMP\.npm" >> $env:GITHUB_ENV
          echo "npm_config_prefer_offline=true" >> $env:GITHUB_ENV

          # Reset error action preference and ensure clean exit
          $ErrorActionPreference = 'Continue'
          echo "✅ Windows Python 3.11 and build environment setup completed successfully"
          exit 0

      # ---------- Install Dependencies (Python 3.11 now available) ----------
      - name: 📋 Install dependencies
        run: |
          echo "🔧 Installing dependencies with proper Electron native module configuration..."
          # Use electron-builder to handle native modules properly
          pnpm install --frozen-lockfile
          echo "🏗️ Rebuilding native modules for Electron..."
          pnpm exec electron-builder install-app-deps
          echo "✅ Dependencies and native modules installed successfully"

      # ---------- Windows Native Module Fix (if needed) ----------
      - name: 🔧 Rebuild native modules for Windows
        if: matrix.platform == 'win'
        run: |
          echo "🔧 Rebuilding native modules specifically for Windows + Electron..."

          # Try electron-builder first (most reliable on Windows)
          echo "🏗️ Using electron-builder to rebuild native modules..."
          npx electron-builder install-app-deps

          # If that fails, try @electron/rebuild as fallback
          if ($LASTEXITCODE -ne 0) {
            echo "⚠️ electron-builder failed, trying @electron/rebuild..."
            npx @electron/rebuild --only=better-sqlite3,keytar
          }

          echo "✅ Windows native module rebuild completed"
        env:
          npm_config_build_from_source: true

      # ---------- Download Build ----------
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

      # ---------- Platform-Specific Packaging ----------
      - name: 📦 Package for macOS
        if: matrix.platform == 'mac'
        run: |
          echo "🏗️ Building macOS packages..."
          echo "📂 Current directory structure:"
          ls -la
          echo "📂 Dist directory contents:"
          ls -la dist/ || echo "❌ dist/ directory not found"
          echo "🔧 Running electron-builder for macOS..."
          if ! npx electron-builder --mac --universal --publish never; then
            echo "❌ ERROR: electron-builder failed for macOS!"
            echo "📂 Post-failure directory contents:"
            ls -la
            echo "📂 Post-failure dist contents:"
            ls -la dist/ || echo "dist/ not found"
            echo "📂 Post-failure release contents:"
            ls -la release/ || echo "release/ not found"
            exit 1
          fi
          echo "✅ macOS packaging completed"
          echo "📦 Release directory contents:"
          ls -la release/ || echo "❌ release/ directory not found"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: 📦 Package for Linux
        if: matrix.platform == 'linux'
        run: |
          echo "🏗️ Building Linux packages..."
          echo "📂 Current directory structure:"
          ls -la
          echo "📂 Dist directory contents:"
          ls -la dist/ || echo "❌ dist/ directory not found"
          echo "🔧 Running electron-builder for Linux..."
          if ! npx electron-builder --linux --x64 --publish never; then
            echo "❌ ERROR: electron-builder failed for Linux!"
            echo "📂 Post-failure directory contents:"
            ls -la
            echo "📂 Post-failure dist contents:"
            ls -la dist/ || echo "dist/ not found"
            echo "📂 Post-failure release contents:"
            ls -la release/ || echo "release/ not found"
            exit 1
          fi
          echo "✅ Linux packaging completed"
          echo "📦 Release directory contents:"
          ls -la release/ || echo "❌ release/ directory not found"
        env:
          DEBUG: electron-builder

      - name: 📦 Package for Windows
        if: matrix.platform == 'win'
        run: |
          echo "🏗️ Building Windows packages..."
          echo "📂 Current directory structure:"
          Get-ChildItem -Force
          echo "📂 Dist directory contents:"
          if (Test-Path dist) { Get-ChildItem dist -Force } else { echo "❌ dist/ directory not found" }
          echo "🔧 Running electron-builder for Windows..."
          if (!(npx electron-builder --win --x64 --publish never)) {
            echo "❌ ERROR: electron-builder failed for Windows!"
            echo "📂 Post-failure directory contents:"
            Get-ChildItem -Force
            echo "📂 Post-failure dist contents:"
            if (Test-Path dist) { Get-ChildItem dist -Force } else { echo "dist/ not found" }
            echo "📂 Post-failure release contents:"
            if (Test-Path release) { Get-ChildItem release -Force } else { echo "release/ not found" }
            exit 1
          }
          echo "✅ Windows packaging completed"
          echo "📦 Release directory contents:"
          if (Test-Path release) { Get-ChildItem release -Force } else { echo "❌ release/ directory not found" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      # ---------- Verify Package Creation ----------
      - name: 🔍 Verify Package Creation
        id: verify-packages
        run: |
          echo "🔍 Verifying packages were created successfully..."

          if [ ! -d "release" ]; then
            echo "❌ ERROR: release/ directory does not exist!"
            echo "📂 Current directory contents:"
            ls -la
            exit 1
          fi

          echo "📦 Release directory contents:"
          ls -la release/

          # Count files matching our expected patterns
          PACKAGE_FILES=$(find release -maxdepth 1 \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" \) | wc -l)
          METADATA_FILES=$(find release -maxdepth 1 \( -name "latest*.yml" -o -name "*.blockmap" \) | wc -l)

          echo "📊 Package files found: $PACKAGE_FILES"
          echo "📊 Metadata files found: $METADATA_FILES"

          if [ $PACKAGE_FILES -eq 0 ]; then
            echo "❌ ERROR: No package files (.dmg, .AppImage, .exe, .deb, .rpm, .zip) found!"
            exit 1
          fi

          echo "✅ Package verification successful"
          echo "package_count=$PACKAGE_FILES" >> $GITHUB_OUTPUT
          echo "metadata_count=$METADATA_FILES" >> $GITHUB_OUTPUT
        shell: bash

      # ---------- Upload Platform Packages ----------
      - name: 📤 Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.zip
            release/latest*.yml
            release/*.blockmap
            !release/**/
          retention-days: 90

  # ---------- Security Analysis ----------
  security:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔍 CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ---------- Release Preparation ----------
  release:
    name: 🎉 Prepare Release
    needs: [validate, package, security]
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write # Required to create releases
      discussions: write # Optional: to create release discussions

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ---------- Download All Packages (Resilient to Missing Artifacts) ----------
      - name: 📥 Download macOS Packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        id: download-mac
        with:
          name: packages-mac-${{ github.sha }}
          path: release-assets/

      - name: 📥 Download Linux Packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        id: download-linux
        with:
          name: packages-linux-${{ github.sha }}
          path: release-assets/

      - name: 📥 Download Windows Packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        id: download-windows
        with:
          name: packages-win-${{ github.sha }}
          path: release-assets/

      # ---------- Check Available Packages ----------
      - name: 📋 Check Available Packages
        id: check-packages
        run: |
          echo "🔍 Checking which packages were successfully built..."

          # Initialize counters and lists
          AVAILABLE_PLATFORMS=""
          FAILED_PLATFORMS=""
          PACKAGE_COUNT=0

          # Check each platform
          if [ "${{ steps.download-mac.outcome }}" = "success" ] && [ -d "release-assets" ] && find release-assets -name "*.dmg" -o -name "*mac*" | grep -q .; then
            echo "✅ macOS packages available"
            AVAILABLE_PLATFORMS="$AVAILABLE_PLATFORMS\n- 🍎 macOS Universal"
            PACKAGE_COUNT=$((PACKAGE_COUNT + 1))
          else
            echo "❌ macOS packages missing"
            FAILED_PLATFORMS="$FAILED_PLATFORMS\n- 🍎 macOS Universal (build failed)"
          fi

          if [ "${{ steps.download-linux.outcome }}" = "success" ] && [ -d "release-assets" ] && find release-assets -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*linux*" | grep -q .; then
            echo "✅ Linux packages available"
            AVAILABLE_PLATFORMS="$AVAILABLE_PLATFORMS\n- 🐧 Linux x64"
            PACKAGE_COUNT=$((PACKAGE_COUNT + 1))
          else
            echo "❌ Linux packages missing"
            FAILED_PLATFORMS="$FAILED_PLATFORMS\n- 🐧 Linux x64 (build failed)"
          fi

          if [ "${{ steps.download-windows.outcome }}" = "success" ] && [ -d "release-assets" ] && find release-assets -name "*.exe" -o -name "*win*" | grep -q .; then
            echo "✅ Windows packages available"
            AVAILABLE_PLATFORMS="$AVAILABLE_PLATFORMS\n- 🪟 Windows x64"
            PACKAGE_COUNT=$((PACKAGE_COUNT + 1))
          else
            echo "❌ Windows packages missing"
            FAILED_PLATFORMS="$FAILED_PLATFORMS\n- 🪟 Windows x64 (build failed)"
          fi

          # Set outputs for later steps
          echo "available_platforms<<EOF" >> $GITHUB_OUTPUT
          echo -e "$AVAILABLE_PLATFORMS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "failed_platforms<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FAILED_PLATFORMS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "package_count=$PACKAGE_COUNT" >> $GITHUB_OUTPUT

          # Determine if we should proceed with release
          if [ $PACKAGE_COUNT -eq 0 ]; then
            echo "❌ No packages were successfully built - cannot create release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "✅ $PACKAGE_COUNT platform(s) built successfully - proceeding with release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      # ---------- Generate Release Notes ----------
      - name: 📝 Generate Release Notes
        id: release_notes
        if: steps.check-packages.outputs.should_release == 'true'
        run: |
          echo "## 🎉 Personyx Build ${{ github.sha }}" > release_notes.md
          echo "" >> release_notes.md

          # Show build status summary
          echo "### 🏗️ Build Status" >> release_notes.md
          echo "Built ${{ steps.check-packages.outputs.package_count }} of 3 target platforms successfully." >> release_notes.md
          echo "" >> release_notes.md

          # Show available platforms
          if [ -n "${{ steps.check-packages.outputs.available_platforms }}" ]; then
            echo "#### ✅ Successfully Built Platforms" >> release_notes.md
            echo "${{ steps.check-packages.outputs.available_platforms }}" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # Show failed platforms if any
          if [ -n "${{ steps.check-packages.outputs.failed_platforms }}" ]; then
            echo "#### ❌ Failed Platform Builds" >> release_notes.md
            echo "${{ steps.check-packages.outputs.failed_platforms }}" >> release_notes.md
            echo "" >> release_notes.md
          fi

          echo "### 📦 Available Downloads" >> release_notes.md
          echo "" >> release_notes.md

          # Check if we have any files to list
          if [ -d "release-assets" ] && [ "$(find release-assets -maxdepth 1 -name "*.dmg" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" | wc -l)" -gt 0 ]; then
            echo "| Platform | File | Size |" >> release_notes.md
            echo "|----------|------|------|" >> release_notes.md

            # List only distributable files with sizes
            find release-assets -maxdepth 1 -name "*.dmg" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" | while read file; do
              if [ -f "$file" ]; then
                size=$(du -h "$file" | cut -f1)
                basename=$(basename "$file")
                platform=$(echo $basename | grep -o -E "(dmg|AppImage|exe)" | head -1)
                case $platform in
                  dmg) platform_name="macOS" ;;
                  AppImage) platform_name="Linux" ;;
                  exe) platform_name="Windows" ;;
                  *) platform_name="Unknown" ;;
                esac
                echo "| $platform_name | $basename | $size |" >> release_notes.md
              fi
            done
          else
            echo "_No downloadable packages available._" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "### 🔍 Validation Results" >> release_notes.md
          echo "- ✅ TypeScript type checking passed" >> release_notes.md
          echo "- ✅ ESLint validation passed" >> release_notes.md
          echo "- ✅ Security scan passed" >> release_notes.md
          echo "- ✅ All tests passed" >> release_notes.md

          if [ "${{ steps.check-packages.outputs.package_count }}" -eq "3" ]; then
            echo "- ✅ All platform builds completed successfully" >> release_notes.md
          else
            echo "- ⚠️ Partial platform build success (${{ steps.check-packages.outputs.package_count }}/3 platforms)" >> release_notes.md
          fi

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ---------- Create Development Release ----------
      - name: 🏷️ Create Development Release
        if: steps.check-packages.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.sha }}
          name: 'Development Build - ${{ github.sha }} (${{ steps.check-packages.outputs.package_count }}/3 platforms)'
          body: ${{ steps.release_notes.outputs.release_notes }}
          files: |
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.zip
            release-assets/latest*.yml
            release-assets/*.blockmap
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: false

      # ---------- Handle No Packages Case ----------
      - name: ⚠️ No Packages Available
        if: steps.check-packages.outputs.should_release == 'false'
        run: |
          echo "❌ No packages were successfully built for this commit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚫 Build Failures" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.check-packages.outputs.failed_platforms }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the individual package job logs for specific error details" >> $GITHUB_STEP_SUMMARY
          echo "2. Common issues include:" >> $GITHUB_STEP_SUMMARY
          echo "   - Native module compilation failures (better-sqlite3, keytar)" >> $GITHUB_STEP_SUMMARY
          echo "   - Electron packaging configuration issues" >> $GITHUB_STEP_SUMMARY
          echo "   - Platform-specific build tool problems" >> $GITHUB_STEP_SUMMARY
          echo "3. Consider re-running the workflow once issues are addressed" >> $GITHUB_STEP_SUMMARY

          # Mark as failed but not exit 1 since this is a handled case
          echo "::warning title=No Packages Built::All platform builds failed - no release created"

      # ---------- Deployment Summary ----------
      - name: 📊 Deployment Summary
        if: always() # Run regardless of previous step outcomes
        run: |
          if [ "${{ steps.check-packages.outputs.should_release }}" = "true" ]; then
            echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Packages Built (${{ steps.check-packages.outputs.package_count }}/3)" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.check-packages.outputs.available_platforms }}" >> $GITHUB_STEP_SUMMARY
            
            if [ -n "${{ steps.check-packages.outputs.failed_platforms }}" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ❌ Failed Builds" >> $GITHUB_STEP_SUMMARY
              echo "${{ steps.check-packages.outputs.failed_platforms }}" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 Release" >> $GITHUB_STEP_SUMMARY
            echo "[📥 Download Development Build](https://github.com/${{ github.repository }}/releases/tag/dev-${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No packages were successfully built. Check the package job logs for details." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⏱️ Build Time" >> $GITHUB_STEP_SUMMARY
          echo "Started: ${{ github.event.head_commit.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
