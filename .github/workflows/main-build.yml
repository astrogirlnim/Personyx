name: 🚀 Main Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggers

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10

jobs:
  # ---------- Full Validation ----------
  validate:
    name: 🧪 Full Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- Checkout & Setup ----------
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Consistent with PR validation
          cache: pnpm

      # ---------- Install System Dependencies with Python 3.11 ----------
      - name: 🔧 Install system dependencies for native modules
        run: |
          sudo apt-get update
          # Install Python 3.11 specifically (has distutils, unlike 3.12+)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-dev python3.11-distutils
          # Install other build dependencies
          sudo apt-get install -y build-essential libsecret-1-dev
          # Configure Python for node-gyp
          sudo ln -sf /usr/bin/python3.11 /usr/bin/python3
          python3 --version
          echo "✅ System dependencies installed with Python 3.11"

      # ---------- Install Dependencies ----------
      - name: 📋 Install dependencies
        run: |
          echo "🔧 Installing dependencies with proper Electron native module configuration..."
          # Install dependencies first
          pnpm install --frozen-lockfile
          echo "✅ Dependencies installed successfully"

      # ---------- Comprehensive Native Module Setup ----------
      - name: 🔧 Rebuild native modules for Electron
        run: |
          echo "🔧 Rebuilding native modules for Electron compatibility..."

          # Clear any potentially problematic build artifacts
          echo "🧹 Cleaning build artifacts..."
          rm -rf node_modules/.pnpm/better-sqlite3*/node_modules/better-sqlite3/build || true
          rm -rf node_modules/.pnpm/keytar*/node_modules/keytar/build || true
          find node_modules -name "node_gyp_bins" -type d -exec rm -rf {} + 2>/dev/null || true

          # Rebuild native modules specifically for Electron's Node version
          echo "🏗️ Rebuilding with electron-builder..."
          pnpm exec electron-builder install-app-deps

          echo "✅ Native module rebuild completed successfully"
        env:
          npm_config_build_from_source: true
          npm_config_electron_version: 28.3.3
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target: 28.3.3
          PYTHON: /usr/bin/python3.11

      # ---------- Security & Quality ----------
      - name: 🕵️ Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 TypeScript Type Check
        run: pnpm typecheck

      - name: 🧹 ESLint & Prettier Check
        run: pnpm lint

      - name: 🧪 Run Test Suite
        run: pnpm test --passWithNoTests --reporter=verbose
        env:
          # Use in-memory database for tests to avoid native module issues
          NODE_ENV: test
          VITEST_DATABASE_URL: ':memory:'

      # ---------- Build Application ----------
      - name: 🏗️ Build Application
        run: pnpm build

      # ---------- Database Validation ----------
      - name: 🗄️ Validate Database Schema & Migrations
        run: |
          echo "🗄️ Validating database schema and migrations..."
          npm run db:validate
          echo "✅ Database validation completed"
        env:
          npm_config_build_from_source: true

      # ---------- Upload Build for Next Job ----------
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ---------- Multi-Platform Packaging ----------
  package:
    name: 📦 Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # Increased timeout for native module compilation

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: universal
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    steps:
      # ---------- Checkout & Setup ----------
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Consistent with PR validation
          cache: pnpm

      # ---------- CRITICAL: Platform-Specific Python Setup BEFORE Install ----------
      - name: 🔧 Setup Python 3.11 for native modules (Linux)
        if: matrix.platform == 'linux'
        run: |
          echo "🔧 Setting up Python 3.11 for Linux native module compilation..."
          sudo apt-get update
          # Install Python 3.11 specifically (has distutils, unlike 3.12+)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-dev python3.11-distutils
          # Install other build dependencies
          sudo apt-get install -y build-essential libsecret-1-dev
          # Configure Python for node-gyp
          sudo ln -sf /usr/bin/python3.11 /usr/bin/python3
          python3 --version
          echo "✅ Linux Python 3.11 setup completed successfully"

      - name: 🔧 Setup Python 3.11 for native modules (macOS)
        if: matrix.platform == 'mac'
        run: |
          echo "🔧 Setting up Python 3.11 for macOS native module compilation..."
          # Install Python 3.11 via Homebrew to avoid distutils issues
          brew install python@3.11
          # Configure Python paths for node-gyp
          echo "/opt/homebrew/opt/python@3.11/bin" >> $GITHUB_PATH
          export PATH="/opt/homebrew/opt/python@3.11/bin:$PATH"
          export PYTHON="/opt/homebrew/opt/python@3.11/bin/python3.11"
          # Update environment for current session
          echo "PYTHON=/opt/homebrew/opt/python@3.11/bin/python3.11" >> $GITHUB_ENV
          echo "npm_config_python=/opt/homebrew/opt/python@3.11/bin/python3.11" >> $GITHUB_ENV
          # Verify Python setup
          python3.11 --version
          python3.11 -c "import distutils; print('✅ distutils available')"
          echo "✅ macOS Python 3.11 setup completed successfully"

      - name: 🔧 Setup Python 3.11 for native modules (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Configure Python for Windows native modules
        if: matrix.platform == 'win'
        run: |
          echo "🔧 Configuring Python 3.11 for Windows native module compilation..."

          # Get Python installation path
          $pythonPath = (Get-Command python).Source
          $pythonDir = Split-Path $pythonPath -Parent
          echo "Python found at: $pythonPath"
          echo "Python directory: $pythonDir"

          # Configure Python paths for node-gyp
          echo "PYTHON=$pythonPath" >> $env:GITHUB_ENV
          echo "npm_config_python=$pythonPath" >> $env:GITHUB_ENV

          # Verify Python setup
          python --version
          python -c "import sys; print('Python executable:', sys.executable)"

          # Check distutils availability and install setuptools if needed
          echo "🔍 Checking Python build tools availability..."
          $distutils_available = $false
          try {
            python -c "import distutils; print('✅ distutils available')" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $distutils_available = $true
              echo "✅ distutils available"
            }
          } catch {
            # Ignore distutils check errors
          }

          if (-not $distutils_available) {
            echo "⚠️ distutils not available, ensuring setuptools is installed..."
            python -m pip install --upgrade setuptools wheel
            if ($LASTEXITCODE -eq 0) {
              echo "✅ setuptools installed successfully"
            } else {
              echo "❌ Failed to install setuptools, but continuing..."
            }
          }

          # Verify build tools are working
          try {
            python -c "import setuptools; print('✅ setuptools available')"
            echo "✅ Python build environment ready for native modules"
          } catch {
            echo "⚠️ setuptools check failed, but native modules may still work"
          }

          # Configure additional Windows build environment for native modules
          echo "🔧 Configuring Windows build environment..."

          # Ensure MSBuild is available (should be pre-installed on GitHub runners)
          try {
            $msbuildPath = (Get-Command msbuild -ErrorAction SilentlyContinue).Source
            if ($msbuildPath) {
              echo "✅ MSBuild found at: $msbuildPath"
              echo "npm_config_msbuild_path=$msbuildPath" >> $env:GITHUB_ENV
            } else {
              echo "⚠️ MSBuild not found in PATH, but may still work"
            }
          } catch {
            echo "⚠️ MSBuild check failed, but may still work"
          }

          # Configure node-gyp for Windows
          echo "npm_config_cache=$env:TEMP\.npm" >> $env:GITHUB_ENV
          echo "npm_config_prefer_offline=true" >> $env:GITHUB_ENV

          # Reset error action preference and ensure clean exit
          $ErrorActionPreference = 'Continue'
          echo "✅ Windows Python 3.11 and build environment setup completed successfully"
          exit 0

      # ---------- Install Dependencies (Python 3.11 now available) ----------
      - name: 📋 Install dependencies
        run: |
          echo "🔧 Installing dependencies with proper Electron native module configuration..."
          # Use electron-builder to handle native modules properly
          pnpm install --frozen-lockfile
          echo "🏗️ Rebuilding native modules for Electron..."
          pnpm exec electron-builder install-app-deps
          echo "✅ Dependencies and native modules installed successfully"

      # ---------- Windows Native Module Fix (if needed) ----------
      - name: 🔧 Rebuild native modules for Windows
        if: matrix.platform == 'win'
        run: |
          echo "🔧 Rebuilding native modules specifically for Windows + Electron..."

          # Try electron-builder first (most reliable on Windows)
          echo "🏗️ Using electron-builder to rebuild native modules..."
          npx electron-builder install-app-deps

          # If that fails, try @electron/rebuild as fallback
          if ($LASTEXITCODE -ne 0) {
            echo "⚠️ electron-builder failed, trying @electron/rebuild..."
            npx @electron/rebuild --only=better-sqlite3,keytar
          }

          echo "✅ Windows native module rebuild completed"
        env:
          npm_config_build_from_source: true

      # ---------- Download Build ----------
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

      # ---------- Platform-Specific Packaging ----------
      - name: 📦 Package for macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --universal --publish never
        env:
          # Add macOS signing secrets when available
          # CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # NOTARIZE: true
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 📦 Package for Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --x64 --publish never

      - name: 📦 Package for Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --x64 --publish never
        env:
          # Add Windows signing secrets when available
          # CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ---------- Upload Platform Packages ----------
      - name: 📤 Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.zip
            release/latest*.yml
            release/*.blockmap
            !release/**/
          retention-days: 90

  # ---------- Firebase Cloud Functions Deployment ----------
  deploy-firebase:
    name: 🔥 Deploy Firebase Functions
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      # ---------- Checkout & Setup ----------
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # ---------- Install Firebase Dependencies ----------
      - name: 📋 Install Firebase Functions dependencies
        run: |
          cd functions
          npm install

      # ---------- Firebase Authentication ----------
      - name: 🔑 Authenticate with Firebase
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 -d > $HOME/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      - name: 🔥 Install Firebase CLI
        run: npm install -g firebase-tools

      # ---------- Configure Functions Environment ----------
      - name: ⚙️ Configure Firebase Functions Environment
        run: |
          echo "🔧 Setting Firebase Functions environment variables..."
          firebase functions:config:set openai.api_key="${{ secrets.OPENAI_API_KEY }}" --project=${{ secrets.FIREBASE_PROJECT_ID }}
          echo "✅ Firebase Functions environment configured"

      # ---------- Build & Deploy Functions ----------
      - name: 🏗️ Build Firebase Functions
        run: |
          cd functions
          npm run build

      - name: 🚀 Deploy Firebase Functions
        run: |
          echo "🚀 Deploying Firebase Functions to project: ${{ secrets.FIREBASE_PROJECT_ID }}"
          firebase deploy --only functions --project=${{ secrets.FIREBASE_PROJECT_ID }} --force
          echo "✅ Firebase Functions deployed successfully"

      # ---------- Verify Deployment ----------
      - name: 🧪 Verify Functions Deployment
        run: |
          echo "🧪 Verifying Firebase Functions deployment..."
          # Test the health check endpoint
          FUNCTIONS_URL="https://us-central1-${{ secrets.FIREBASE_PROJECT_ID }}.cloudfunctions.net"
          curl -f "$FUNCTIONS_URL/healthCheck" || echo "⚠️ Health check failed - functions may be cold starting"
          echo "✅ Deployment verification completed"

  # ---------- Security Analysis ----------
  security:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔍 CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ---------- Release Preparation ----------
  release:
    name: 🎉 Prepare Release
    needs: [validate, package, security, deploy-firebase]
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write # Required to create releases
      discussions: write # Optional: to create release discussions

    steps:
      - name: 📊 Generate Success Summary
        run: |
          echo "## 🎉 Build & Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application Build | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| Multi-Platform Package | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Analysis | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Functions | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔥 Firebase Services" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** ${{ secrets.FIREBASE_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Functions URL:** https://us-central1-${{ secrets.FIREBASE_PROJECT_ID }}.cloudfunctions.net" >> $GITHUB_STEP_SUMMARY
          echo "- **Available Endpoints:** embeddings, batchEmbeddings, healthCheck, getSupportedModels" >> $GITHUB_STEP_SUMMARY
