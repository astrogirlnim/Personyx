name: 🔍 PR Validation

on:
  pull_request:
    branches: [main, '*']

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10

jobs:
  validate:
    name: 🧪 Validate Changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ---------- Checkout & Setup ----------
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better gitleaks scanning

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Ensures Node version matches .nvmrc for local/CI consistency
          cache: pnpm

      # ---------- Install System Dependencies ----------
      - name: 🔧 Install system dependencies for native modules
        run: |
          sudo apt-get update
          # Install Python 3.11 specifically (has distutils, unlike 3.12+)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-dev python3.11-distutils
          # Install other build dependencies
          sudo apt-get install -y build-essential libsecret-1-dev
          # Configure Python for node-gyp
          sudo ln -sf /usr/bin/python3.11 /usr/bin/python3
          python3 --version
          echo "✅ System dependencies installed with Python 3.11"

      # ---------- Install Dependencies ----------
      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------- Comprehensive Native Module Setup ----------
      - name: 🔧 Rebuild native modules for Electron
        run: |
          echo "🔧 Rebuilding native modules for Electron compatibility..."

          # Clear any potentially problematic build artifacts
          echo "🧹 Cleaning build artifacts..."
          rm -rf node_modules/.pnpm/better-sqlite3*/node_modules/better-sqlite3/build || true
          rm -rf node_modules/.pnpm/keytar*/node_modules/keytar/build || true
          find node_modules -name "node_gyp_bins" -type d -exec rm -rf {} + 2>/dev/null || true

          # Rebuild native modules specifically for Electron's Node version
          echo "🏗️ Rebuilding with electron-builder..."
          npx electron-builder install-app-deps --force

          echo "✅ Native module rebuild completed successfully"
        env:
          npm_config_build_from_source: true
          npm_config_electron_version: 28.3.3
          PYTHON: /usr/bin/python3.11

      # ---------- Security Scan ----------
      - name: 🕵️ Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Code Quality Checks ----------
      - name: 🔍 TypeScript Type Check
        run: pnpm typecheck

      - name: 🧹 ESLint & Prettier Check
        run: pnpm lint

      - name: 🧪 Run Tests
        run: pnpm test --passWithNoTests --reporter=verbose
        env:
          # Use in-memory database for tests to avoid native module issues
          NODE_ENV: test
          VITEST_DATABASE_URL: ':memory:'

      # ---------- Build Verification ----------
      - name: 🏗️ Build Application
        run: pnpm build

      # ---------- Database Validation ----------
      - name: 🗄️ Validate Database Schema & Migrations
        run: |
          echo "🗄️ Validating database schema and migrations..."
          npm run db:validate
          echo "✅ Database validation completed"
        env:
          npm_config_build_from_source: true

      # ---------- Electron Packaging Test ----------
      - name: 📦 Test Electron Packaging (Linux x64)
        run: |
          echo "📦 Testing Electron packaging for Linux x64..."
          npx electron-builder --dir --linux --x64 --config.directories.output=dist-test
          echo "✅ Electron packaging test completed successfully"
        env:
          # Skip notarization and signing for PR builds
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Skip native module rebuild since we already did it
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      # ---------- Upload Build Artifacts ----------
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pr-build-${{ github.event.number }}
          path: |
            dist/
            dist-test/
          retention-days: 7

  # ---------- Security & Dependency Analysis ----------
  security:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔍 CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ---------- PR Summary ----------
  summary:
    name: 📊 PR Summary
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: always()

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🎯 PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.validate.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.validate.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Schema | ${{ needs.validate.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Electron Packaging | ${{ needs.validate.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.validate.result }}" == "success" && "${{ needs.security.result }}" == "success" ]]; then
            echo "🎉 All checks passed! This PR is ready for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some checks failed. Please review the logs and fix issues." >> $GITHUB_STEP_SUMMARY
          fi
