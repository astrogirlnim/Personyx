name: 🔍 PR Validation

on:
  pull_request:
    branches: [main, '*']

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10

jobs:
  # ---------- Core Validation (Fast) ----------
  validate:
    name: 🧪 Core Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🔧 Setup Python 3.11 for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev python3-dev
          python -m pip install --upgrade setuptools wheel
          python -c "import setuptools; print('setuptools ready for node-gyp')"

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🕵️ Security scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 TypeScript type check
        run: pnpm typecheck

      - name: 🧹 Lint & format check
        run: pnpm lint:check

      - name: 🧪 Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          VITEST_DATABASE_URL: ':memory:'

      - name: 🏗️ Build application
        run: pnpm build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ---------- Multi-Platform Validation (Representative Subset) ----------
  platform-validation:
    name: 📦 Platform Validation (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm64
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # ---------- Platform-Specific Dependencies ----------
      - name: 🔧 Setup Python 3.11 (Unix)
        if: matrix.platform != 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Setup Python 3.11 (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev python3-dev
          python -m pip install --upgrade setuptools wheel
          python -c "import setuptools; print('setuptools ready for node-gyp')"

      - name: 🔧 Install system dependencies (macOS)
        if: startsWith(matrix.platform, 'mac')
        run: |
          xcode-select --install 2>/dev/null || true
          python -m pip install --upgrade setuptools wheel
          python -c "import setuptools; print('setuptools ready for node-gyp')"

      - name: 🔧 Configure Python for native modules (Windows)
        if: matrix.platform == 'win'
        run: |
          chcp 65001
          python -m pip install --upgrade setuptools wheel
          python -c "import setuptools; print('setuptools ready for node-gyp')"
        env:
          PYTHONIOENCODING: utf-8

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

      - name: 🔧 Rebuild native modules for Electron
        run: |
          echo "🔧 Rebuilding native modules for Electron on ${{ matrix.platform }} (${{ matrix.arch }})..."

          # Clean up any existing build artifacts that might cause conflicts
          echo "🧹 Cleaning build artifacts..."
          find node_modules -name "build" -type d -path "*/better-sqlite3/*" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "build" -type d -path "*/keytar/*" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "node_gyp_bins" -type d -exec rm -rf {} + 2>/dev/null || true

          # Use electron-builder's official method for native module rebuilds
          echo "🔄 Using electron-builder install-app-deps..."
          npx electron-builder install-app-deps --arch=${{ matrix.arch }} || {
            echo "⚠️ electron-builder install-app-deps failed, trying @electron/rebuild..."
            npx @electron/rebuild --only=better-sqlite3,keytar --force --arch=${{ matrix.arch }}
          }
        env:
          npm_config_build_from_source: true
          npm_config_electron_version: 28.3.3
          npm_config_target: 28.3.3
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_prefer_offline: true
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}

      # ---------- Platform-Specific Packaging Tests ----------
      - name: 📦 Test packaging for macOS ARM64
        if: matrix.platform == 'mac-arm64'
        run: npx electron-builder --mac --arm64 --publish never --config.directories.output=dist-test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 📦 Test packaging for Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --x64 --publish never --config.directories.output=dist-test

      - name: 📦 Test packaging for Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --x64 --publish never --config.directories.output=dist-test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 📤 Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: test-packages-${{ matrix.platform }}-${{ github.event.number }}
          path: |
            dist-test/*.dmg
            dist-test/*.AppImage  
            dist-test/*.exe
            dist-test/*.zip
          retention-days: 7

  # ---------- Security & Dependency Analysis ----------
  security:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔍 CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ---------- PR Summary ----------
  summary:
    name: 📊 PR Summary
    runs-on: ubuntu-latest
    needs: [validate, platform-validation, security]
    if: always()

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🎯 PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Core Validation | ${{ needs.validate.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform Builds | ${{ needs.platform-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Platform Testing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS ARM64 (most common Mac)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux x64 (native module testing)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows x64 (Unicode fixes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.validate.result }}" == "success" && "${{ needs.platform-validation.result }}" == "success" && "${{ needs.security.result }}" == "success" ]]; then
            echo "🎉 All checks passed! This validates Phase 2 CI changes." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Ready for merge** - Main build will test full multi-platform matrix." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some checks failed. Please review the logs and fix issues." >> $GITHUB_STEP_SUMMARY
          fi
